# Secrets (DATABASE_URL, IRG_ESTATE_TOKEN, IRG_ESTATE_URL) come from the irg-secrets Secret, created by
# the overlay (from AWS Secrets Manager via External Secrets in production), mounted read-only as
# files and read through *_FILE variables, never exposed as environment variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: irg-api}
  template:
    metadata:
      labels: {app: irg-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      serviceAccountName: irg
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: irg-api}}}
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: irg-api}}}
      containers:
        - name: api
          image: irg
          args: [api]
          envFrom: [{configMapRef: {name: irg-config}}]
          env:
            - {name: DATABASE_URL_FILE, value: /var/run/secrets/irg/DATABASE_URL}
            - {name: IRG_ESTATE_TOKEN_FILE, value: /var/run/secrets/irg/IRG_ESTATE_TOKEN}
            - {name: IRG_ESTATE_URL_FILE, value: /var/run/secrets/irg/IRG_ESTATE_URL}
          ports: [{containerPort: 8080, name: http}]
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, failureThreshold: 3}
          lifecycle:
            preStop: {sleep: {seconds: 5}} # endpoints drop the pod before the server stops accepting
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: secrets, mountPath: /var/run/secrets/irg, readOnly: true}]
      volumes: [{name: secrets, secret: {secretName: irg-secrets, defaultMode: 0440}}]  # group-readable; fsGroup gives the app group ownership
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irg
  # production overlay annotates this with the IRSA role (Secrets Manager read, Bedrock invoke)
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: irg-api}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: irg-api}

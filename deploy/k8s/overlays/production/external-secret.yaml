apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: irg-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: irg-secrets, creationPolicy: Owner}
  dataFrom:
    - extract: {key: irg/production/app} # DATABASE_URL, IRG_ESTATE_URL, IRG_ESTATE_TOKEN (OIDC and Bedrock settings go in irg-config)
